<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fffaf6">
  <title>拾分 · 一起记分</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" defer></script>
  <script src="./supabase-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      color-scheme: light;
      --ink: #24211f;
      --muted: #9a9692;
      --line: #f0ece8;
      --orange: #f27645;
      --orange-dark: #e85f2d;
      --peach: #fff1e9;
      --green: #3d9b78;
      --surface: #fff;
      --background: #fffaf6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }

    * { box-sizing: border-box; }
    body { margin: 0; color: var(--ink); background: var(--background); }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    .page { width: min(1080px, 100% - 48px); margin: 0 auto; padding: 18px 0 36px; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 18px; margin-bottom: 20px; }
    .brand { display: flex; align-items: center; gap: 9px; font-size: 18px; font-weight: 800; letter-spacing: -.5px; }
    .brand-mark { display: grid; width: 34px; height: 34px; place-items: center; color: white; background: var(--orange); border-radius: 11px; font-size: 19px; }
    .top-actions { display: flex; align-items: center; gap: 8px; }
    .button { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 42px; padding: 0 16px; border: 1px solid var(--line); border-radius: 12px; color: var(--ink); background: white; font-weight: 650; transition: .18s ease; }
    .button:hover { transform: translateY(-1px); border-color: #e3d8d0; }
    .button.primary { color: white; border-color: var(--orange); background: var(--orange); }
    .button.primary:hover { border-color: var(--orange-dark); background: var(--orange-dark); }
    .button.quiet { color: var(--orange-dark); border-color: #f7d9ca; background: #fff8f4; }
    .button.small { min-height: 36px; padding: 0 12px; font-size: 13px; }
    .button.icon-button { width: 38px; padding: 0; font-size: 18px; }
    .room-menu-button { display: inline-flex; }
    .topbar.landing .top-actions { display: none; }
    .topbar.landing { margin-bottom: 30px; }
    .welcome { max-width: 700px; margin: clamp(36px, 12vh, 110px) auto; text-align: center; }
    .welcome-mark { display: grid; width: 62px; height: 62px; margin: 0 auto 20px; place-items: center; border-radius: 20px; color: #fff; background: var(--orange); font-size: 32px; font-weight: 800; box-shadow: 0 8px 25px #f2764530; }
    .welcome h1 { margin: 0 0 10px; font-size: clamp(29px, 6vw, 40px); letter-spacing: -1px; }
    .welcome-copy { margin: 0; color: var(--muted); font-size: 14px; }
    .welcome-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; max-width: 500px; margin: 32px auto 0; }
    .welcome-action { display: grid; min-height: 112px; align-content: center; justify-items: center; gap: 7px; padding: 18px; border: 1px solid var(--line); border-radius: 18px; color: var(--ink); background: #fff; font-size: 16px; font-weight: 750; box-shadow: 0 7px 24px #38200d05; }
    .welcome-action.primary { border-color: var(--orange); color: #fff; background: var(--orange); }
    .welcome-action span { font-size: 12px; font-weight: 450; opacity: .8; }
    .welcome-note { margin-top: 24px; color: var(--muted); font-size: 12px; line-height: 1.7; }
    .cloud-warning { margin-top: 18px; padding: 12px 15px; border: 1px solid #f5d4c4; border-radius: 12px; color: #a14d2c; background: #fff4ed; font-size: 12px; line-height: 1.6; }
    .hero { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) 250px; gap: 34px; overflow: hidden; padding: 37px 40px; border: 1px solid #f4e9e1; border-radius: 24px; background: linear-gradient(115deg, #fff 0%, #fff 63%, #fff2e9 100%); box-shadow: 0 10px 35px #6333130b; }
    .hero::after { position: absolute; right: 148px; bottom: -105px; width: 280px; height: 280px; border: 1px solid #f5dfd2; border-radius: 50%; content: ""; pointer-events: none; }
    .eyebrow { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; font-weight: 650; }
    .live-dot { width: 8px; height: 8px; border-radius: 50%; background: #51bd8d; box-shadow: 0 0 0 4px #e7f7ef; }
    h1 { margin: 13px 0 8px; font-size: clamp(28px, 4vw, 38px); letter-spacing: -1.2px; }
    .hero-copy { margin: 0; color: var(--muted); font-size: 14px; }
    .hero-stats { display: flex; align-items: center; gap: 28px; margin-top: 28px; }
    .stat + .stat { padding-left: 28px; border-left: 1px solid var(--line); }
    .stat-number { display: block; font-size: 26px; font-weight: 800; letter-spacing: -.5px; }
    .stat-label { color: var(--muted); font-size: 12px; }
    .hero-side { z-index: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 155px; border-left: 1px solid #f0e1d7; }
    .my-score { color: var(--orange-dark); font-size: 53px; font-weight: 850; line-height: 1.1; letter-spacing: -2px; }
    .my-score-label { margin-top: 6px; color: var(--muted); font-size: 13px; }
    .room-meta { display: flex; align-items: center; gap: 8px; margin-top: 18px; color: #807a75; font-size: 12px; }
    .room-code { padding: 4px 8px; color: #a25331; background: #ffede3; border-radius: 6px; font-weight: 750; letter-spacing: 1px; }
    .main-grid { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(285px, .85fr); gap: 22px; margin-top: 22px; }
    .card { border: 1px solid var(--line); border-radius: 20px; background: var(--surface); box-shadow: 0 7px 24px #38200d05; }
    .card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 22px 23px 15px; }
    .card-title { margin: 0; font-size: 16px; font-weight: 760; }
    .card-subtitle { margin: 5px 0 0; color: var(--muted); font-size: 12px; }
    .tabs { display: flex; align-items: center; color: var(--orange-dark); font-size: 12px; font-weight: 750; }
    .member-list { padding: 0 23px 12px; }
    .member { display: grid; grid-template-columns: 38px minmax(0, 1fr) auto auto; align-items: center; gap: 12px; min-height: 67px; border-top: 1px solid #f5f2ef; }
    .avatar { display: grid; width: 38px; height: 38px; place-items: center; border-radius: 50%; background: #f2f0ed; font-size: 18px; }
    .avatar.you { background: #fff0e8; }
    .member-identity { display: flex; min-width: 0; align-items: center; gap: 10px; padding: 0; border: 0; color: inherit; background: transparent; text-align: left; }
    .member-identity:disabled { cursor: default; }
    .member-identity:not(:disabled):hover .member-name { color: var(--orange-dark); }
    .member-name { display: block; overflow: hidden; font-size: 13px; font-weight: 700; text-overflow: ellipsis; white-space: nowrap; }
    .member-hint { display: block; overflow: hidden; margin-top: 4px; color: var(--muted); font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }
    .score-value { min-width: 56px; text-align: right; font-size: 15px; font-weight: 800; }
    .score-unit { color: var(--muted); font-size: 11px; font-weight: 500; }
    .score-adjust { padding: 7px; border: 0; border-radius: 8px; color: var(--orange-dark); background: transparent; font-size: 12px; font-weight: 700; }
    .score-adjust:hover { background: var(--peach); }
    .rank { width: 23px; color: #b4aea8; text-align: center; font-size: 12px; font-weight: 750; }
    .rank.first { color: #e3a33a; }
    .activity-list { padding: 0 23px 14px; }
    .activity { display: flex; align-items: flex-start; gap: 11px; padding: 13px 0; border-top: 1px solid #f5f2ef; }
    .activity-icon { display: grid; flex: 0 0 30px; width: 30px; height: 30px; place-items: center; border-radius: 10px; background: #eff8f3; color: var(--green); font-size: 14px; font-weight: 800; }
    .activity-icon.minus { color: var(--orange-dark); background: #fff2eb; }
    .activity-detail { min-width: 0; flex: 1; }
    .activity-text { font-size: 12px; line-height: 1.5; }
    .activity-time { margin-top: 4px; color: #aaa49e; font-size: 10px; }
    .activity-points { padding-top: 4px; color: var(--green); font-size: 13px; font-weight: 800; white-space: nowrap; }
    .activity-points.minus { color: var(--orange-dark); }
    .quick-actions { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; padding: 0 23px 22px; }
    .quick-actions .button { min-height: 46px; }
    .modal-backdrop { position: fixed; z-index: 5; inset: 0; display: grid; place-items: center; padding: 18px; background: #201a16a6; }
    .modal { width: min(430px, 100%); max-height: calc(100vh - 36px); overflow: auto; padding: 26px; border-radius: 22px; background: white; box-shadow: 0 20px 70px #21140f2e; }
    .modal-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
    .modal-title { margin: 0; font-size: 21px; letter-spacing: -.4px; }
    .modal-copy { margin: 8px 0 20px; color: var(--muted); font-size: 13px; line-height: 1.6; }
    .close { display: grid; width: 34px; height: 34px; place-items: center; border: 0; border-radius: 10px; color: var(--muted); background: #f7f5f3; font-size: 21px; }
    .field { display: grid; gap: 7px; margin: 15px 0; }
    .field label { color: #716a65; font-size: 12px; font-weight: 700; }
    .field input, .field select { width: 100%; min-height: 46px; padding: 0 13px; border: 1px solid #eae5e1; border-radius: 11px; outline: none; color: var(--ink); background: white; }
    .field input:focus, .field select:focus { border-color: #f3a27d; box-shadow: 0 0 0 3px #fff0e8; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 9px; margin-top: 19px; }
    .qr-wrap { display: grid; width: 190px; height: 190px; margin: 20px auto 13px; place-items: center; border: 1px solid var(--line); border-radius: 15px; background: white; }
    .qr-wrap img, .qr-wrap canvas { width: 160px; height: 160px; }
    .join-code { margin: 12px auto; text-align: center; font-size: 24px; font-weight: 850; letter-spacing: 5px; color: var(--orange-dark); }
    .center-copy { color: var(--muted); font-size: 12px; text-align: center; line-height: 1.6; }
    .toast { position: fixed; z-index: 10; left: 50%; bottom: 26px; padding: 11px 17px; transform: translateX(-50%); border-radius: 12px; color: white; background: #292421; box-shadow: 0 8px 25px #0002; font-size: 13px; }
    .empty { padding: 26px 0; color: var(--muted); text-align: center; font-size: 13px; }
    [hidden] { display: none !important; }

    @media (max-width: 740px) {
      .page { width: min(100% - 24px, 560px); padding: 9px 0 24px; }
      .topbar { margin-bottom: 12px; }
      .brand { gap: 7px; font-size: 15px; }
      .brand-mark { width: 29px; height: 29px; border-radius: 9px; font-size: 16px; }
      .brand > span:last-child > span { display: none; }
      .top-actions { gap: 6px; }
      .top-actions .button { min-height: 34px; padding: 0 9px; font-size: 11px; white-space: nowrap; }
      .top-actions #newRoomBtn, .top-actions #joinRoomBtn, .top-actions #backupBtn { display: none; }
      .room-menu-button { display: inline-flex; }
      .topbar.landing { margin-bottom: 14px; }
      .welcome { margin: 9vh auto; }
      .welcome-actions { gap: 9px; margin-top: 24px; }
      .welcome-action { min-height: 96px; padding: 12px; font-size: 14px; }
      .hero { grid-template-columns: minmax(0, 1fr) auto; gap: 10px; padding: 17px 15px; border-radius: 17px; }
      .hero::after { right: 23px; }
      h1 { margin: 8px 0 5px; font-size: 23px; }
      .hero-copy { max-width: 220px; font-size: 11px; line-height: 1.5; }
      .hero-stats { gap: 12px; margin-top: 15px; }
      .stat + .stat { padding-left: 12px; }
      .stat-number { font-size: 19px; }
      .stat-label { font-size: 10px; }
      .hero-side { min-height: 108px; padding-left: 11px; }
      .my-score { font-size: 34px; }
      .my-score-label { font-size: 11px; }
      .room-meta { flex-wrap: wrap; gap: 5px; font-size: 10px; }
      .main-grid { grid-template-columns: 1fr; gap: 12px; margin-top: 12px; }
      .card-head { padding: 15px 14px 11px; }
      .member-list, .activity-list { padding-right: 13px; padding-left: 13px; }
      .quick-actions { padding: 0 13px 14px; }
      .quick-actions { gap: 7px; }
      .quick-actions .button { gap: 5px; padding: 0 6px; font-size: 12px; }
      .member { grid-template-columns: 24px minmax(0, 1fr) auto auto; gap: 7px; min-height: 62px; }
      .avatar { width: 34px; height: 34px; font-size: 16px; }
      .member-identity { gap: 7px; }
      .score-value { min-width: 42px; font-size: 14px; }
      .score-adjust { padding: 7px 5px; font-size: 11px; }
      .activity-list { padding-bottom: 8px; }
    }
    @media (max-width: 390px) {
      .top-actions .button { padding: 0 8px; }
      .hero { padding-right: 15px; padding-left: 16px; }
      .hero-side { padding-left: 10px; }
      .stat + .stat { padding-left: 13px; }
      .hero-stats { gap: 13px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="topbar landing" id="topbar">
      <div class="brand"><span class="brand-mark">分</span><span>拾分 <span style="font-size:12px;color:#aaa;font-weight:500">一起记分，开心相聚</span></span></div>
      <div class="top-actions">
        <button class="button small" id="newRoomBtn">＋ 新建房间</button>
        <button class="button small" id="joinRoomBtn">加入房间</button>
        <button class="button small" id="backupBtn">数据备份</button>
        <button class="button small room-menu-button" id="roomMenuBtn" aria-label="房间和数据管理">管理</button>
        <button class="button small primary" id="inviteBtn">＋ 邀请好友</button>
      </div>
    </header>

    <section class="welcome" id="welcome" hidden>
      <div class="welcome-mark">分</div>
      <h1>把快乐记下来</h1>
      <p class="welcome-copy">创建一个房间，或加入朋友的房间一起记分。</p>
      <div class="welcome-actions">
        <button class="welcome-action primary" id="welcomeCreateBtn">＋ 新建房间<span>从 0 分开始，邀请伙伴加入</span></button>
        <button class="welcome-action" id="welcomeJoinBtn">↗ 加入房间<span>输入房间码或扫描邀请二维码</span></button>
      </div>
      <p class="welcome-note" id="welcomeNote"></p>
      <div class="cloud-warning" id="cloudWarning" hidden></div>
    </section>
    <div id="roomView" hidden>
    <section class="hero" aria-labelledby="roomName">
      <div>
        <div class="eyebrow"><span class="live-dot"></span>正在进行的积分房间</div>
        <h1 id="roomName"></h1>
        <p class="hero-copy">一起记下每个小目标，让努力都被看见。</p>
        <div class="hero-stats">
          <div class="stat"><span class="stat-number" id="memberCount">0</span><span class="stat-label">位伙伴</span></div>
          <div class="stat"><span class="stat-number" id="totalPoints">0</span><span class="stat-label">净积分</span></div>
          <div class="stat"><span class="stat-number" id="myRank">—</span><span class="stat-label">我的排名</span></div>
        </div>
        <div class="room-meta">房间码 <span class="room-code" id="roomCode"></span><button class="button small" id="copyCodeBtn">复制</button></div>
      </div>
      <div class="hero-side">
        <span class="my-score" id="myPoints">0</span>
        <span class="my-score-label">我的积分</span>
      </div>
    </section>

    <section class="main-grid">
      <article class="card">
        <div class="card-head">
          <div><h2 class="card-title">房间伙伴</h2><p class="card-subtitle">点击「调整」可手动修改积分</p></div>
          <div class="tabs">积分排行</div>
        </div>
        <div class="member-list" id="memberList"></div>
        <div class="quick-actions">
          <button class="button primary" id="addPointsBtn">＋ 记积分</button>
          <button class="button quiet" id="transferBtn">↗ 转出积分</button>
          <button class="button" id="addMemberBtn">＋ 邀请伙伴</button>
        </div>
      </article>
      <article class="card">
        <div class="card-head">
          <div><h2 class="card-title">积分明细</h2><p class="card-subtitle">记分、调整和转赠记录</p></div>
        </div>
        <div class="activity-list" id="activityList"></div>
      </article>
    </section>
    </div>
  </main>
  <div id="modalRoot" hidden></div>
  <div class="toast" id="toast" hidden></div>

  <script>
    const LAST_ROOM_KEY = "shifen-last-room-v1";
    const SUPABASE_URL = window.SHIFEN_SUPABASE?.url || "";
    const SUPABASE_ANON_KEY = window.SHIFEN_SUPABASE?.anonKey || "";
    const icons = ["🌿", "🪴", "☀️", "🍊", "🌼", "🐻", "🌙"];
    const initialState = {
      roomName: "周末小聚",
      roomCode: "PKX7",
      currentId: "me",
      members: [
        { id: "me", name: "林间风", points: 0, icon: "🌿" },
        { id: "m2", name: "周小满", points: 0, icon: "☀️" },
        { id: "m3", name: "阿澈", points: 0, icon: "🍊" }
      ],
      transactions: []
    };

    let state = structuredClone(initialState);
    let toastTimer;
    let db = null;
    let authUser = null;
    let roomChannel = null;
    let channelRoomId = null;
    let activeRoomId = null;
    let isCloudRoom = false;
    let refreshTimer;
    let isLoadingRoom = false;
    let inviteJoinFlow = false;

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, char => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[char]);
    }

    function getMember(id) {
      return state.members.find(member => member.id === id);
    }

    function showWelcome(message = "") {
      activeRoomId = null;
      isCloudRoom = false;
      document.getElementById("welcome").hidden = false;
      document.getElementById("roomView").hidden = true;
      document.getElementById("topbar").classList.add("landing");
      const note = document.getElementById("welcomeNote");
      note.textContent = db
        ? "房间和积分会在所有成员的设备间同步。"
        : "跨设备加入需要先连接 Supabase；当前网页尚未配置共享数据库。";
      const warning = document.getElementById("cloudWarning");
      warning.hidden = Boolean(db);
      warning.textContent = message || "云端共享房间尚未配置。完成 Supabase 数据库设置后，好友才能通过相同房间码加入并共享积分。";
    }

    function showRoom() {
      document.getElementById("welcome").hidden = true;
      document.getElementById("roomView").hidden = false;
      document.getElementById("topbar").classList.remove("landing");
    }

    function requireCloud() {
      if (db) return true;
      showToast("共享房间尚未启用，请先配置 Supabase 项目");
      return false;
    }

    function cloudError(error) {
      console.error(error);
      showToast(error?.message || "云端请求失败，请检查网络后重试");
    }

    async function initializeCloud() {
      showWelcome();
      if (!SUPABASE_URL || !SUPABASE_ANON_KEY) return;
      if (!window.supabase?.createClient) {
        showWelcome("云端组件加载失败，请检查网络或稍后重试。");
        return;
      }
      try {
        db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
          auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
        });
        const { data: sessionData, error: sessionError } = await db.auth.getSession();
        if (sessionError) throw sessionError;
        if (sessionData.session) authUser = sessionData.session.user;
        else {
          const { data, error } = await db.auth.signInAnonymously();
          if (error) throw error;
          authUser = data.user;
        }
        const inviteCode = new URLSearchParams(location.search).get("room");
        const lastRoomId = localStorage.getItem(LAST_ROOM_KEY);
        if (inviteCode) {
          showJoinRoom(inviteCode, true);
        } else if (lastRoomId) {
          try {
            await loadCloudRoom(lastRoomId);
          } catch (error) {
            showWelcome("上次使用的房间无法读取，请确认仍有网络连接，或重新输入房间码加入。");
          }
        } else {
          showWelcome();
        }
      } catch (error) {
        db = null;
        showWelcome("Supabase 连接失败。请确认 URL、匿名登录设置和数据库权限。");
        cloudError(error);
      }
    }

    function mapCloudEvent(event) {
      const amount = Number(event.amount);
      if (!Number.isSafeInteger(amount)) throw new Error("积分明细超出安全整数范围");
      return {
        id: event.id,
        type: event.kind,
        actor: event.actor_member_id,
        from: event.kind === "transfer" ? event.actor_member_id : undefined,
        to: event.recipient_member_id,
        amount: event.kind === "transfer" ? Math.abs(amount) : amount,
        note: event.note,
        time: new Date(event.created_at).getTime()
      };
    }

    async function loadCloudRoom(roomId, roomRecord) {
      if (isLoadingRoom) return;
      isLoadingRoom = true;
      try {
        let room = roomRecord;
        if (!room) {
          const { data, error } = await db.from("score_rooms").select("id,room_code,name").eq("id", roomId).single();
          if (error) throw error;
          room = data;
        }
        const [membersResponse, eventsResponse] = await Promise.all([
          db.from("score_members").select("id,user_id,display_name,icon,points").eq("room_id", room.id).order("points", { ascending: false }),
          db.from("score_events").select("id,actor_member_id,recipient_member_id,kind,amount,note,created_at").eq("room_id", room.id).order("created_at", { ascending: false }).limit(500)
        ]);
        if (membersResponse.error) throw membersResponse.error;
        if (eventsResponse.error) throw eventsResponse.error;
        const members = membersResponse.data.map(member => ({
          id: member.id,
          userId: member.user_id,
          name: member.display_name,
          icon: member.icon,
          points: Number(member.points)
        }));
        if (members.some(member => !Number.isSafeInteger(member.points))) throw new Error("房间积分超出安全整数范围，暂时无法显示");
        const current = members.find(member => member.userId === authUser.id);
        if (!current) throw new Error("当前账号尚未加入此房间，请使用房间码加入");
        const transactions = eventsResponse.data.map(mapCloudEvent);
        state = {
          roomName: room.name,
          roomCode: room.room_code,
          currentId: current.id,
          members,
          transactions
        };
        activeRoomId = room.id;
        isCloudRoom = true;
        localStorage.setItem(LAST_ROOM_KEY, room.id);
        render();
        showRoom();
        subscribeToRoom(room.id);
      } finally {
        isLoadingRoom = false;
      }
    }

    function subscribeToRoom(roomId) {
      if (roomChannel && channelRoomId === roomId) return;
      if (roomChannel) db.removeChannel(roomChannel);
      roomChannel = db.channel(`score-room-${roomId}`)
        .on("postgres_changes", { event: "*", schema: "public", table: "score_members", filter: `room_id=eq.${roomId}` }, scheduleRoomRefresh)
        .on("postgres_changes", { event: "*", schema: "public", table: "score_events", filter: `room_id=eq.${roomId}` }, scheduleRoomRefresh)
        .subscribe(status => {
          if (status === "CHANNEL_ERROR" || status === "TIMED_OUT") showToast("实时同步暂时中断，正在尝试重连");
        });
      channelRoomId = roomId;
    }

    function scheduleRoomRefresh() {
      clearTimeout(refreshTimer);
      refreshTimer = setTimeout(async () => {
        if (!activeRoomId) return;
        if (isLoadingRoom) {
          scheduleRoomRefresh();
          return;
        }
        try {
          await loadCloudRoom(activeRoomId, { id: activeRoomId, room_code: state.roomCode, name: state.roomName });
        } catch (error) {
          cloudError(error);
        }
      }, 160);
    }

    async function runRoomMutation(functionName, args, successMessage) {
      if (!db || !activeRoomId) {
        showToast("请先创建或加入一个云端房间");
        return false;
      }
      const { error } = await db.rpc(functionName, { p_room_id: activeRoomId, ...args });
      if (error) {
        cloudError(error);
        return false;
      }
      try {
        await loadCloudRoom(activeRoomId, { id: activeRoomId, room_code: state.roomCode, name: state.roomName });
      } catch (error) {
        cloudError(error);
        return false;
      }
      if (successMessage) showToast(successMessage);
      return true;
    }

    function formatTime(time) {
      const elapsed = Math.max(0, Date.now() - time);
      if (elapsed < 60000) return "刚刚";
      if (elapsed < 3600000) return `${Math.floor(elapsed / 60000)} 分钟前`;
      if (elapsed < 86400000) return `${Math.floor(elapsed / 3600000)} 小时前`;
      return `${Math.floor(elapsed / 86400000)} 天前`;
    }

    function transactionMarkup(transaction) {
      if (transaction.type === "earn") {
        const actor = getMember(transaction.actor);
        const recipient = getMember(transaction.to);
        if (!actor || !recipient) return "";
        const mine = recipient.id === state.currentId;
        return `<div class="activity">
          <div class="activity-icon">＋</div>
          <div class="activity-detail">
            <div class="activity-text">${escapeHtml(actor.name)} 给 ${escapeHtml(recipient.name)} 记入积分${actor.id === state.currentId ? " <span style='color:#aaa'>(我记录)</span>" : ""}<br><span style="color:#8d8680">${escapeHtml(transaction.note || "积分奖励")}</span></div>
            <div class="activity-time">${formatTime(transaction.time)}</div>
          </div>
          <div class="activity-points">${mine ? "+" : ""}${transaction.amount}</div>
        </div>`;
      }
      if (transaction.type === "adjust") {
        const actor = getMember(transaction.actor);
        const recipient = getMember(transaction.to);
        if (!actor || !recipient) return "";
        const positive = transaction.amount > 0;
        return `<div class="activity">
          <div class="activity-icon${positive ? "" : " minus"}">${positive ? "＋" : "−"}</div>
          <div class="activity-detail">
            <div class="activity-text">${escapeHtml(actor.name)} 调整了 ${escapeHtml(recipient.name)} 的积分${actor.id === state.currentId ? " <span style='color:#aaa'>(我调整)</span>" : ""}<br><span style="color:#8d8680">${escapeHtml(transaction.note || "手动调整")}</span></div>
            <div class="activity-time">${formatTime(transaction.time)}</div>
          </div>
          <div class="activity-points${positive ? "" : " minus"}">${positive ? "+" : ""}${transaction.amount}</div>
        </div>`;
      }
      const from = getMember(transaction.from);
      const to = getMember(transaction.to);
      if (!from || !to) return "";
      const isMine = transaction.from === state.currentId || transaction.to === state.currentId;
      const amountClass = transaction.from === state.currentId ? " minus" : "";
      const displayAmount = transaction.to === state.currentId ? `+${transaction.amount}` : transaction.from === state.currentId ? `-${transaction.amount}` : `${transaction.amount}`;
      return `<div class="activity">
        <div class="activity-icon${amountClass}">${transaction.to === state.currentId ? "↙" : "↗"}</div>
        <div class="activity-detail">
          <div class="activity-text">${escapeHtml(from.name)} 转给 ${escapeHtml(to.name)}${isMine ? " <span style='color:#aaa'>(我)</span>" : ""}<br><span style="color:#8d8680">${escapeHtml(transaction.note || "积分转赠")}</span></div>
          <div class="activity-time">${formatTime(transaction.time)}</div>
        </div>
        <div class="activity-points${amountClass}">${displayAmount}</div>
      </div>`;
    }

    function render() {
      const current = getMember(state.currentId);
      const ranked = [...state.members].sort((a, b) => b.points - a.points);
      const allTied = ranked.length > 1 && ranked.every(member => member.points === ranked[0].points);
      document.title = `${state.roomName} · 拾分`;
      document.getElementById("roomName").textContent = state.roomName;
      document.getElementById("roomCode").textContent = state.roomCode;
      document.getElementById("memberCount").textContent = state.members.length;
      document.getElementById("totalPoints").textContent = state.members.reduce((sum, member) => sum + member.points, 0).toLocaleString("zh-CN");
      document.getElementById("myRank").textContent = allTied ? "并列" : `${ranked.findIndex(member => member.id === state.currentId) + 1}`;
      document.getElementById("myPoints").textContent = current.points.toLocaleString("zh-CN");
      document.getElementById("memberList").innerHTML = ranked.map((member, index) => `
        <div class="member">
          <span class="rank${index === 0 ? " first" : ""}">${String(index + 1).padStart(2, "0")}</span>
          <button class="member-identity" type="button" data-transfer="${escapeHtml(member.id)}"${member.id === state.currentId ? " disabled" : ""} aria-label="${member.id === state.currentId ? "这是我" : `转积分给${escapeHtml(member.name)}`}">
            <span class="avatar${member.id === state.currentId ? " you" : ""}">${escapeHtml(member.icon || "🙂")}</span>
            <span><span class="member-name">${escapeHtml(member.name)}${member.id === state.currentId ? "（我）" : ""}</span><span class="member-hint">${allTied ? "当前积分并列" : index === 0 ? "本房间积分领先" : member.points < 0 ? "积分可继续积累" : "继续积累，越来越棒"}</span></span>
          </button>
          <button class="score-adjust" type="button" data-adjust="${escapeHtml(member.id)}" aria-label="调整${escapeHtml(member.name)}的积分">调整</button>
          <span class="score-value">${member.points.toLocaleString("zh-CN")} <span class="score-unit">分</span></span>
        </div>`).join("");
      const history = [...state.transactions].sort((a, b) => b.time - a.time);
      document.getElementById("activityList").innerHTML = history.map(transactionMarkup).join("") || '<div class="empty">还没有积分记录</div>';
      document.querySelectorAll("[data-adjust]").forEach(button => button.addEventListener("click", () => showAdjustPoints(button.dataset.adjust)));
      document.querySelectorAll("[data-transfer]").forEach(button => button.addEventListener("click", () => showTransfer(button.dataset.transfer)));
    }

    function showToast(message) {
      const toast = document.getElementById("toast");
      toast.textContent = message;
      toast.hidden = false;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => { toast.hidden = true; }, 2300);
    }

    function openModal(title, copy, content) {
      const root = document.getElementById("modalRoot");
      root.innerHTML = `<div class="modal-backdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="modal-top"><h2 class="modal-title" id="modalTitle">${title}</h2><button class="close" aria-label="关闭" data-close>×</button></div>
        <p class="modal-copy">${copy}</p>${content}</section></div>`;
      root.hidden = false;
      root.querySelector("[data-close]").addEventListener("click", closeModal);
      root.querySelector(".modal-backdrop").addEventListener("click", event => { if (event.target.classList.contains("modal-backdrop")) closeModal(); });
      const focusTarget = root.querySelector("input, select, button:not([data-close])");
      if (focusTarget) focusTarget.focus();
    }

    function closeModal() {
      const root = document.getElementById("modalRoot");
      root.hidden = true;
      root.innerHTML = "";
      if (inviteJoinFlow && !activeRoomId) showWelcome();
      inviteJoinFlow = false;
    }

    function exportBackup() {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = `shifen-${state.roomCode}-${new Date().toISOString().slice(0, 10)}.json`;
      link.click();
      URL.revokeObjectURL(link.href);
      showToast("备份文件已导出，请保存到安全的位置");
    }

    function showRoomMenu() {
      openModal("房间与数据", "房间、成员和积分明细保存在云端，所有成员可跨设备同步。建议定期导出数据备份。", `
        <div class="quick-actions" style="padding:0;grid-template-columns:1fr 1fr">
          <button class="button" id="menuCreateRoom">＋ 新建房间</button>
          <button class="button" id="menuJoinRoom">加入房间</button>
          <button class="button quiet" id="menuBackup">导出备份</button>
        </div>
        <div class="modal-actions"><button class="button" id="persistStorageBtn">退出当前房间</button></div>
        <p class="center-copy">备份可以保存到本机；云端数据暂不支持从备份导入。退出后房间不会删除，可再次输入房间码加入。</p>`);
      document.getElementById("menuCreateRoom").addEventListener("click", () => { closeModal(); showCreateRoom(); });
      document.getElementById("menuJoinRoom").addEventListener("click", () => { closeModal(); showJoinRoom(); });
      document.getElementById("menuBackup").addEventListener("click", exportBackup);
      document.getElementById("persistStorageBtn").addEventListener("click", async () => {
        if (roomChannel) db.removeChannel(roomChannel);
        roomChannel = null;
        channelRoomId = null;
        localStorage.removeItem(LAST_ROOM_KEY);
        closeModal();
        showWelcome();
      });
    }

    async function copyText(text) {
      try {
        await navigator.clipboard.writeText(text);
        showToast("已复制到剪贴板");
      } catch {
        const field = document.createElement("textarea");
        field.value = text;
        field.style.position = "fixed";
        field.style.opacity = "0";
        document.body.append(field);
        field.select();
        const copied = document.execCommand("copy");
        field.remove();
        if (copied) showToast("已复制到剪贴板");
        else showToast("复制失败，请手动选择房间码");
      }
    }

    function invite() {
      if (!activeRoomId) {
        showToast("请先创建或加入一个房间");
        return;
      }
      const inviteUrl = new URL(location.href);
      inviteUrl.searchParams.set("room", state.roomCode);
      openModal("邀请好友加入", `分享房间码，或者让好友扫描二维码加入「${escapeHtml(state.roomName)}」。`, `
        <div class="qr-wrap" id="qrCode"><span style="color:#aaa;font-size:12px">二维码加载中…</span></div>
        <div class="join-code">${escapeHtml(state.roomCode)}</div>
        <div class="center-copy">好友输入房间码即可加入<br>二维码打开后可直接进入这个云端房间</div>
        <div class="modal-actions"><button class="button" data-close>稍后</button><button class="button primary" id="shareLinkBtn">复制邀请链接</button></div>`);
      document.getElementById("shareLinkBtn").addEventListener("click", () => copyText(inviteUrl.href));
      const drawCode = () => {
        const target = document.getElementById("qrCode");
        if (target && window.QRCode) {
          target.innerHTML = "";
          new QRCode(target, { text: inviteUrl.href, width: 160, height: 160, colorDark: "#26211e", colorLight: "#ffffff", correctLevel: QRCode.CorrectLevel.M });
        } else if (target) {
          target.innerHTML = `<span style="padding:14px;text-align:center;color:#8d8680;font-size:12px;line-height:1.6">暂时无法加载二维码<br>请复制房间码加入</span>`;
        }
      };
      if (window.QRCode) drawCode();
      else {
        let tries = 0;
        const interval = setInterval(() => {
          if (window.QRCode || ++tries > 20 || document.getElementById("qrCode") === null) {
            clearInterval(interval);
            drawCode();
          }
        }, 150);
      }
    }

    function showTransfer(recipientId = "") {
      const current = getMember(state.currentId);
      const friends = state.members.filter(member => member.id !== state.currentId);
      if (!friends.length) {
        showToast("先添加一位伙伴，再转出积分");
        return;
      }
      if (recipientId && !friends.some(member => member.id === recipientId)) {
        showToast("找不到这位房间伙伴");
        return;
      }
      openModal("转出积分", `当前积分 ${current.points} 分。转赠后立即更新双方积分；积分允许为负。`, `
        <form id="transferForm">
          <div class="field"><label for="transferTo">转给谁</label><select id="transferTo" required>${friends.map(member => `<option value="${escapeHtml(member.id)}"${member.id === recipientId ? " selected" : ""}>${escapeHtml(member.name)} · ${member.points} 分</option>`).join("")}</select></div>
          <div class="field"><label for="transferAmount">转出积分</label><input id="transferAmount" type="number" min="1" step="1" placeholder="请输入正整数，余额可转为负数" required></div>
          <div class="field"><label for="transferNote">备注（选填）</label><input id="transferNote" maxlength="32" placeholder="例如：今天打卡完成啦"></div>
          <div class="modal-actions"><button type="button" class="button" data-close>取消</button><button type="submit" class="button primary">确认转出</button></div>
        </form>`);
      document.getElementById("transferForm").addEventListener("submit", event => {
        event.preventDefault();
        const recipient = getMember(document.getElementById("transferTo").value);
        const amount = Number(document.getElementById("transferAmount").value);
        const note = document.getElementById("transferNote").value.trim();
        if (!recipient || !Number.isSafeInteger(amount) || amount < 1 || !Number.isSafeInteger(current.points - amount) || !Number.isSafeInteger(recipient.points + amount)) {
          showToast("积分数量无效或超出整数范围");
          return;
        }
        const previous = structuredClone(state);
        runRoomMutation("transfer_score_points", {
          p_recipient_member_id: recipient.id,
          p_amount: amount,
          p_note: note
        }, `已转给 ${recipient.name} ${amount} 分`).then(success => { if (success) closeModal(); });
      });
    }

    function showAddPoints() {
      const current = getMember(state.currentId);
      openModal("记一笔积分", "给自己或房间伙伴增加积分，积分从 0 开始积累。", `
        <form id="addPointsForm">
          <div class="field"><label for="pointsTo">记给谁</label><select id="pointsTo" required>${state.members.map(member => `<option value="${escapeHtml(member.id)}"${member.id === current.id ? " selected" : ""}>${escapeHtml(member.name)} · ${member.points} 分</option>`).join("")}</select></div>
          <div class="field"><label for="pointsAmount">增加积分</label><input id="pointsAmount" type="number" min="1" max="1000000" placeholder="请输入积分数量" required></div>
          <div class="field"><label for="pointsNote">备注（选填）</label><input id="pointsNote" maxlength="32" placeholder="例如：完成今日运动打卡"></div>
          <div class="modal-actions"><button type="button" class="button" data-close>取消</button><button type="submit" class="button primary">确认记分</button></div>
        </form>`);
      document.getElementById("addPointsForm").addEventListener("submit", event => {
        event.preventDefault();
        const recipient = getMember(document.getElementById("pointsTo").value);
        const amount = Number(document.getElementById("pointsAmount").value);
        const note = document.getElementById("pointsNote").value.trim();
        if (!recipient || !Number.isSafeInteger(amount) || amount < 1 || !Number.isSafeInteger(recipient.points + amount)) {
          showToast("积分数量无效或超出整数范围");
          return;
        }
        runRoomMutation("add_score_points", {
          p_recipient_member_id: recipient.id,
          p_amount: amount,
          p_note: note
        }, `已为 ${recipient.name} 记入 ${amount} 分`).then(success => { if (success) closeModal(); });
      });
    }

    function showAdjustPoints(memberId) {
      const member = getMember(memberId);
      if (!member) {
        showToast("找不到这位房间伙伴");
        return;
      }
      openModal(`调整${escapeHtml(member.name)}的积分`, `当前积分 ${member.points} 分。输入正数增加、负数减少，可以调整到负分。`, `
        <form id="adjustForm">
          <div class="field"><label for="adjustAmount">积分变化</label><input id="adjustAmount" type="number" step="1" placeholder="例如 20 或 -10" required></div>
          <div class="field"><label for="adjustNote">备注（选填）</label><input id="adjustNote" maxlength="32" placeholder="例如：补记上周积分"></div>
          <div class="modal-actions"><button type="button" class="button" data-close>取消</button><button type="submit" class="button primary">确认调整</button></div>
        </form>`);
      document.getElementById("adjustForm").addEventListener("submit", event => {
        event.preventDefault();
        const amount = Number(document.getElementById("adjustAmount").value);
        const note = document.getElementById("adjustNote").value.trim();
        if (!Number.isSafeInteger(amount) || amount === 0 || !Number.isSafeInteger(member.points + amount)) {
          showToast("请输入有效的非零整数，且结果需在安全范围内");
          return;
        }
        runRoomMutation("adjust_score_points", {
          p_recipient_member_id: member.id,
          p_delta: amount,
          p_note: note
        }, `${member.name} 的积分已${amount > 0 ? "增加" : "减少"} ${Math.abs(amount)} 分`).then(success => { if (success) closeModal(); });
      });
    }

    function showAddMember() {
      invite();
    }

    function showJoinRoom(prefillCode = "", fromInvite = false) {
      if (!requireCloud()) return;
      inviteJoinFlow = fromInvite;
      if (fromInvite) document.getElementById("welcome").hidden = true;
      const suggestedName = localStorage.getItem("shifen-nickname-v1") || "";
      openModal("加入记分房间", fromInvite ? "请输入你的昵称，即可加入好友的房间。" : "输入好友分享的房间码，加入后即可查看同一房间的成员和积分。", `
        <form id="joinForm">
          ${fromInvite ? `<div class="center-copy">房间码：${escapeHtml(prefillCode.toUpperCase())}</div>` : `<div class="field"><label for="joinCodeInput">房间码</label><input id="joinCodeInput" maxlength="8" placeholder="例如 A1B2C3" value="${escapeHtml(prefillCode)}" required></div>`}
          <div class="field"><label for="joinNickname">你的昵称</label><input id="joinNickname" maxlength="24" value="${escapeHtml(suggestedName)}" placeholder="请输入在房间显示的昵称" required></div>
          <div class="modal-actions"><button type="button" class="button" data-close>取消</button><button type="submit" class="button primary">加入房间</button></div>
        </form>`);
      document.getElementById("joinForm").addEventListener("submit", async event => {
        event.preventDefault();
        const code = (fromInvite ? prefillCode : document.getElementById("joinCodeInput").value).trim().toUpperCase();
        const memberName = document.getElementById("joinNickname").value.trim();
        if (code.length < 4 || !memberName) {
          showToast("请填写有效房间码和昵称");
          return;
        }
        try {
          const { data, error } = await db.rpc("join_score_room", {
            p_room_code: code,
            p_member_name: memberName,
            p_icon: icons[Math.floor(Math.random() * icons.length)]
          });
          if (error) throw error;
          const room = Array.isArray(data) ? data[0] : data;
          if (!room?.id) throw new Error("房间加入失败，请确认房间码后重试");
          localStorage.setItem("shifen-nickname-v1", memberName);
          await loadCloudRoom(room.id, room);
          closeModal();
          showToast(`已加入「${room.name}」`);
        } catch (error) {
          cloudError(error);
        }
      });
    }

    function showCreateRoom() {
      if (!requireCloud()) return;
      const suggestedName = localStorage.getItem("shifen-nickname-v1") || "";
      openModal("新建记分房间", "创建后会生成房间码。邀请伙伴扫码或输入房间码，即可进入同一房间。", `
        <form id="createRoomForm">
          <div class="field"><label for="newRoomName">房间名称</label><input id="newRoomName" maxlength="20" placeholder="例如：周末小聚" required></div>
          <div class="field"><label for="creatorNickname">你的昵称</label><input id="creatorNickname" maxlength="24" value="${escapeHtml(suggestedName)}" placeholder="请输入在房间显示的昵称" required></div>
          <div class="modal-actions"><button type="button" class="button" data-close>取消</button><button type="submit" class="button primary">创建房间</button></div>
        </form>`);
      document.getElementById("createRoomForm").addEventListener("submit", async event => {
        event.preventDefault();
        const roomName = document.getElementById("newRoomName").value.trim();
        const memberName = document.getElementById("creatorNickname").value.trim();
        if (!roomName || !memberName) {
          showToast("请填写房间名称和昵称");
          return;
        }
        try {
          const { data, error } = await db.rpc("create_score_room", {
            p_name: roomName,
            p_member_name: memberName,
            p_icon: icons[Math.floor(Math.random() * icons.length)]
          });
          if (error) throw error;
          const room = Array.isArray(data) ? data[0] : data;
          if (!room?.id) throw new Error("房间创建失败，请重试");

    document.getElementById("newRoomBtn").addEventListener("click", showCreateRoom);
    document.getElementById("roomMenuBtn").addEventListener("click", showRoomMenu);
    document.getElementById("backupBtn").addEventListener("click", exportBackup);
    document.getElementById("inviteBtn").addEventListener("click", invite);
    document.getElementById("joinRoomBtn").addEventListener("click", showJoinRoom);
    document.getElementById("addMemberBtn").addEventListener("click", showAddMember);
    document.getElementById("addPointsBtn").addEventListener("click", showAddPoints);
    document.getElementById("transferBtn").addEventListener("click", showTransfer);
    document.getElementById("copyCodeBtn").addEventListener("click", () => copyText(state.roomCode));
    document.addEventListener("keydown", event => { if (event.key === "Escape") closeModal(); });

    document.getElementById("welcomeCreateBtn").addEventListener("click", showCreateRoom);
    document.getElementById("welcomeJoinBtn").addEventListener("click", () => showJoinRoom(new URLSearchParams(location.search).get("room") || ""));
    initializeCloud();
  </script>
</body>
</html>
